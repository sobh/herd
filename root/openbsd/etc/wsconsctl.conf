# Swap Escape with Caps Lock and left Alt with left Super on the console.
# wsconsctl(8) applies these at boot; X11 reads keyboards raw and needs XKB.
# The map applies to every attached keyboard, ergonomic ones included.
#
# Keycodes are PC/AT scancodes (USB keyboards are translated to them); list
# the current map with: wsconsctl keyboard.map
keyboard.map+="keycode 1=Caps_Lock"
keyboard.map+="keycode 58=Escape"
keyboard.map+="keycode 56=Meta_L"
keyboard.map+="keycode 219=Alt_L"
